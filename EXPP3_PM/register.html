<!DOCTYPE html>
<html>
<head>
    <title>ElectroHub - Registration</title>
</head>

<body style="margin:0;
background-image:url('https://images.unsplash.com/photo-1498049794561-7780e7231661?w=1200');
background-size:cover;
background-position:center;
font-family:Verdana,sans-serif;">

<div style="width:480px;
margin:35px auto;
padding:30px;
background:rgba(255,255,255,0.92);
border:4px solid #002b5b;
border-radius:10px;
box-shadow:8px 8px 18px gray;
text-align:left;">

<h1 style="text-align:center;
color:#002b5b;
text-shadow:2px 2px 4px orange;">
ElectroHub Registration
</h1>

<form action="login.html">

<label style="font-size:18px;color:#002b5b;">
Full Name
</label>
<br><br>

<input type="text" placeholder="Enter Full Name"
style="width:95%;padding:10px;border:2px solid orange;border-radius:6px;">

<br><br>

<label style="font-size:18px;color:#002b5b;">
Email Address
</label>
<br><br>

<input type="email" placeholder="Enter Email Address"
style="width:95%;padding:10px;border:2px solid orange;border-radius:6px;">

<br><br>

<label style="font-size:18px;color:#002b5b;">
Mobile Number
</label>
<br><br>

<input type="tel" placeholder="Enter Mobile Number"
style="width:95%;padding:10px;border:2px solid orange;border-radius:6px;">

<br><br>

<label style="font-size:18px;color:#002b5b;">
Create Password
</label>
<br><br>

<input type="password" placeholder="Create Password"
style="width:95%;padding:10px;border:2px solid orange;border-radius:6px;">

<br><br>

<label style="font-size:18px;color:#002b5b;">
Confirm Password
</label>
<br><br>

<input type="password" placeholder="Confirm Password"
style="width:95%;padding:10px;border:2px solid orange;border-radius:6px;">

<br><br>

<label style="font-size:18px;color:#002b5b;">
Gender
</label>
<br><br>

<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other

<br><br>

<label style="font-size:18px;color:#002b5b;">
State
</label>
<br><br>

<select style="width:97%;
padding:10px;
border:2px solid orange;
border-radius:6px;">

<option>Select State</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Karnataka</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>

</select>

<br><br>

<label style="font-size:18px;color:#002b5b;">
Address
</label>
<br><br>

<textarea rows="4" cols="35"
style="width:95%;
padding:10px;
border:2px solid orange;
border-radius:6px;"></textarea>

<br><br>

<input type="checkbox">

<span style="font-size:16px;color:#333;">
I accept the Terms &amp; Conditions
</span>

<br><br><br>

<input type="submit"
value="Register"
style="background:#002b5b;
color:white;
padding:12px 35px;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;">

<input type="reset"
value="Reset"
style="background:orange;
color:#002b5b;
padding:12px 35px;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;">

<br><br>

<p style="text-align:center;">

<a href="login.html"
style="color:#002b5b;
text-decoration:none;
font-weight:bold;">
Already have an account? Login
</a>

</p>

</form>

<hr style="border:1px solid orange;">

<p style="text-align:center;color:#002b5b;">
&copy; 2026 ElectroHub Electronics Store. All Rights Reserved.
</p>

</div>

</body>
</html>
