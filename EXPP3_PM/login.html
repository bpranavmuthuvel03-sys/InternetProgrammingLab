<!DOCTYPE html>
<html>
<head>
    <title>ElectroHub - Login</title>
</head>

<body style="margin:0;
background-image:url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1200');
background-size:cover;
background-position:center;
font-family:Verdana,sans-serif;">

<div style="width:380px;
margin:70px auto;
padding:30px;
background-color:rgba(0,43,91,0.90);
border:4px solid orange;
border-radius:12px;
box-shadow:6px 6px 18px black;
text-align:center;">

<h1 style="color:orange;
text-shadow:2px 2px 5px white;">
ElectroHub Login
</h1>

<form action="index.html">

<label style="color:white;
font-size:18px;">
Username
</label>

<br><br>

<input type="text"
placeholder="Enter Username"
style="width:90%;
padding:10px;
border:2px solid orange;
border-radius:6px;">

<br><br>

<label style="color:white;
font-size:18px;">
Password
</label>

<br><br>

<input type="password"
placeholder="Enter Password"
style="width:90%;
padding:10px;
border:2px solid orange;
border-radius:6px;">

<br><br>

<input type="checkbox">

<span style="color:white;
font-size:16px;">
Remember Me
</span>

<br><br>

<input type="submit"
value="Login"
style="background:orange;
color:#002b5b;
padding:10px 35px;
border:none;
border-radius:6px;
font-size:18px;
font-weight:bold;
cursor:pointer;">

<br><br>

<a href="register.html"
style="color:yellow;
text-decoration:none;
font-size:16px;">
Create New Account
</a>

<br><br>

<a href="#"
style="color:white;
text-decoration:none;
font-size:16px;">
Forgot Password?
</a>

</form>

<hr style="border:1px solid orange;">

<p style="color:white;">
&copy; 2026 ElectroHub Electronics Store
</p>

</div>

</body>
</html>
