<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quick Order Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Verdana, sans-serif;
            background: #e9eef5;
        }

        header {
            background: #243447;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .card {
            width: 500px;
            margin: 45px auto;
            background: white;
            padding: 30px 35px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
            color: #243447;
            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbc4ce;
            border-radius: 4px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #243447;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background: #243447;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #162331;
        }

        .orders {
            text-align: center;
            margin-top: 20px;
        }

        .orders a {
            color: #243447;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Quick Order Portal</h1>
</header>

<div class="card">

    <h2>Enter Order Details</h2>

    <form method="POST" action="insert_order.php">

        <div class="field">
            <label for="customer">Customer Name</label>
            <input type="text"
                   id="customer"
                   name="customer_name"
                   placeholder="Enter customer name"
                   required>
        </div>

        <div class="field">
            <label for="product">Product</label>
            <input type="text"
                   id="product"
                   name="product_name"
                   placeholder="Enter product name"
                   required>
        </div>

        <div class="field">
            <label for="quantity">Quantity</label>
            <input type="number"
                   id="quantity"
                   name="quantity"
                   min="1"
                   required>
        </div>

        <div class="field">
            <label for="price">Unit Price</label>
            <input type="number"
                   id="price"
                   name="price"
                   min="0"
                   step="0.01"
                   required>
        </div>

        <button type="submit">Save Order</button>

    </form>

    <div class="orders">
        <a href="view_orders.php">Check Saved Orders</a>
    </div>

</div>

</body>
</html>
