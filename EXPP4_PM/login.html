<!DOCTYPE html>
<html>
<head>
<title>Job Portal Login</title>
<style>
body{
    font-family:Arial;
    background:#f2f2f2;
}
.container{
    width:300px;
    margin:100px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
input{
    width:90%;
    padding:8px;
    margin:10px;
}
button{
    padding:10px 20px;
    background:green;
    color:white;
    border:none;
}
</style>

<script>
function login(){
    let user=document.getElementById("user").value;
    let pass=document.getElementById("pass").value;

    if(user=="" || pass==""){
        alert("Enter Username and Password");
        return false;
    }

    window.location="house.html";
    return false;
}
</script>
</head>

<body>

<div class="container">
<h2>Job Portal Login</h2>

<form onsubmit="return login()">
<input type="text" id="user" placeholder="Username"><br>
<input type="password" id="pass" placeholder="Password"><br>
<button type="submit">Login</button>
</form>

</div>

</body>
</html>
